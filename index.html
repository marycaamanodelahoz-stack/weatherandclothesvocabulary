<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City, Weather &amp; Clothes – Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e0;--card:#ffffff;--ink:#2b2350;--soft:#625b86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1633;--card:#2a2450;--ink:#fff7e6;--soft:#c4bde6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1633;--card:#2a2450;--ink:#fff7e6;--soft:#c4bde6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;font-size:16px;line-height:1.3}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.hero{position:relative;overflow:hidden;background:#74d3f7;border-radius:34px;padding:44px 18px 70px;text-align:center}
.hero h1{margin:0;font-size:clamp(34px,8vw,64px);line-height:1;color:#fff;font-weight:700;text-shadow:3px 3px 0 #2b2350,-1px -1px 0 #2b2350,3px -1px 0 #2b2350,-1px 3px 0 #2b2350;transform:rotate(-1.5deg)}
.hero p{display:inline-block;margin:18px 0 0;background:#fff;color:#2b2350;padding:7px 20px;border-radius:99px;font-weight:600;transform:rotate(1deg)}
.hero .d{position:absolute}
.hills{position:absolute;left:0;right:0;bottom:0;height:60px}
nav{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0 6px}
nav a{text-decoration:none;color:#fff;padding:8px 16px;border-radius:99px;font-weight:600;font-size:15px;text-shadow:1px 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 rgba(43,35,80,.28)}
section{background:color-mix(in srgb,var(--c) 15%,var(--bg));border-radius:34px;margin:26px 0;padding:22px 18px 24px}
section>h2{display:inline-block;margin:0 0 4px;background:var(--c);color:#fff;font-size:clamp(22px,5vw,30px);font-weight:700;padding:8px 22px;border-radius:20px;transform:rotate(-1.2deg);text-shadow:2px 2px 0 rgba(0,0,0,.22);box-shadow:0 5px 0 rgba(43,35,80,.3)}
.sub{margin:6px 6px 14px;color:var(--soft);font-weight:500}
h3{display:inline-block;margin:18px 0 12px;font-size:19px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--c) 35%,var(--card));padding:4px 16px;border-radius:99px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
.it{background:var(--card);border-radius:26px;padding:12px 8px 12px;text-align:center;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,transparent)}
.ic{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:#fffdf6;display:flex;align-items:center;justify-content:center}
.ic svg{width:70px;height:70px}
.it b{display:block;font-size:18px;font-weight:700}
.it span{color:var(--soft);font-size:14px;font-weight:500}
.bubs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.bub{background:var(--card);padding:11px 18px 12px;border-radius:24px 24px 24px 6px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,transparent)}
.bub:nth-child(even){border-radius:24px 24px 6px 24px}
.bub b{display:block;font-size:18px;font-weight:600}
.bub span{color:var(--soft);font-size:14px}
.bub i{display:block;color:var(--c);font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--card);padding:7px 16px;border-radius:99px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,transparent)}
.chip b{font-weight:600}
.chip span{color:var(--soft);font-size:14px;margin-left:6px}
.note{margin:18px 4px 0;font-size:19px;font-weight:600}
.note u{text-decoration-thickness:3px;text-underline-offset:5px}
.qs{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.qs>div{background:var(--card);border-radius:34px 34px 34px 8px;padding:20px;text-align:center;box-shadow:0 7px 0 color-mix(in srgb,var(--c) 55%,transparent)}
.qs .ic{width:110px;height:110px}.qs .ic svg{width:92px;height:92px}
.qs b{display:block;font-size:23px;font-weight:700}
.qs em{display:block;margin-top:8px;color:var(--c);font-style:normal;font-weight:700;font-size:21px}
.it,.bub,.chip,.qs>div{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.it:hover,.bub:hover,.chip:hover,.qs>div:hover{transform:translateY(-5px) rotate(-1.5deg)}
.it:hover .ic svg,.qs>div:hover .ic svg{animation:wig .6s}
.pre{opacity:0}
.in{animation:enter .65s cubic-bezier(.3,1.5,.5,1) backwards}
.pop{animation:pop .6s ease-out}
.pop .ic svg{animation:spin .6s ease-in-out}
@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.8) rotate(-3deg)}60%{transform:translateY(-6px) scale(1.04)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}25%{transform:scale(.88,1.12) translateY(4px)}50%{transform:scale(1.08,.94) translateY(-18px) rotate(-3deg)}75%{transform:scale(.97,1.04) translateY(2px)}100%{transform:scale(1)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
#snd{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;background:#2b2350;color:#fff;border:0;border-radius:99px;padding:10px 18px;font:600 15px Fredoka,'Trebuchet MS',sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pre{opacity:1}}
footer{text-align:center;color:var(--soft);font-size:14px;margin:26px 0 12px}
</style>
</head>
<body>
<div class="wrap">
<div class="hero" id="hero"><h1>City, Weather<br>&amp; Clothes</h1><p>Vocabulario esencial · Essential vocabulary</p></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer>English 1 · Study guide</footer>
</div>
<script>
const O='stroke="#2b2350" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
const svg=b=>`<svg viewBox="0 0 64 64" ${O}>${b}</svg>`;
const R=(x,y,w,h,f,r=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"/>`;
const P=(d,f)=>`<path d="${d}" fill="${f}"/>`;
const Ci=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const E=(x,y,a,b,f)=>`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${f}"/>`;
const L=(d,s)=>`<path d="${d}" fill="none"${s?` stroke="${s}"`:''}/>`;
const TX=(x,y,t,s,f='#2b2350')=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="middle" fill="${f}" stroke="none" font-family="Fredoka,Trebuchet MS,sans-serif">${t}</text>`;
const D='#2b2350';
const rays=(x,y,r)=>[...Array(8)].map((_,i)=>{const a=i*Math.PI/4,c=Math.cos(a),s=Math.sin(a);return L(`M${x+c*(r+4)} ${y+s*(r+4)}L${x+c*(r+10)} ${y+s*(r+10)}`,'#f59e0b')}).join("");
const sun=(x,y,r,sh)=>rays(x,y,r)+Ci(x,y,r,'#ffd54f')+(sh?R(x-r*.75,y-r*.35,r*.65,r*.45,D,2)+R(x+r*.1,y-r*.35,r*.65,r*.45,D,2)+L(`M${x-r*.1} ${y-r*.15}H${x+r*.1}`):Ci(x-r*.35,y-r*.15,1.2,D)+Ci(x+r*.35,y-r*.15,1.2,D))+L(`M${x-r*.35} ${y+r*.3}Q${x} ${y+r*.65} ${x+r*.35} ${y+r*.3}`);
const cl=(f,t='')=>`<g transform="${t}">${P("M18 42a9 9 0 0 1 0-18a13 13 0 0 1 25-3a10 10 0 0 1 3 21Z",f)}</g>`;
const drop=(x,y,f='#42a5f5')=>P(`M${x} ${y}Q${x-3.5} ${y+6} ${x} ${y+8}Q${x+3.5} ${y+6} ${x} ${y}Z`,f);
const flake=(x,y,s=4)=>L(`M${x} ${y-s}V${y+s}M${x-s} ${y-s/2}L${x+s} ${y+s/2}M${x+s} ${y-s/2}L${x-s} ${y+s/2}`,'#4f9be8');
// buildings
const classic=(b,r,g='')=>R(10,26,44,28,b)+P("M5 27L32 9L59 27Z",r)+R(27,38,10,16,'#fff4d6',2)+R(14,32,9,9,'#bfe9ff',2)+R(41,32,9,9,'#bfe9ff',2)+g;
const tall=(b,r,g='')=>R(14,10,36,44,b)+R(11,6,42,7,r,2)+R(18,26,9,8,'#bfe9ff',1)+R(37,26,9,8,'#bfe9ff',1)+R(18,38,9,8,'#bfe9ff',1)+R(37,38,9,8,'#bfe9ff',1)+R(27,44,10,10,'#fff4d6',1)+g;
const shop=(b,a1,a2,g)=>R(8,24,48,30,b)+[0,1,2,3,4,5].map(i=>P(`M${6+i*8.67} 16H${14.67+i*8.67}L${15+i*8.67} 28H${5.67+i*8.67}Z`,i%2?a2:a1)).join("")+R(12,34,12,12,'#bfe9ff',2)+R(40,34,12,12,'#bfe9ff',2)+R(27,38,10,16,'#fff4d6',2)+Ci(32,10,9,'#fff')+g;
const I={};
I.bank=classic('#f6d77a','#e8704f',TX(32,25,'$',12));
I.ATM=R(12,6,40,52,'#42a5f5',5)+R(18,12,28,18,'#d7f3ff',3)+TX(32,25,'ATM',9)+R(20,36,24,5,'#263238',2)+R(26,46,12,8,'#fff4d6',2);
I.hospital=tall('#e3f2fd','#ef5350',P("M30 13H34V16H37V20H34V23H30V20H27V16H30Z",'#e53935'));
I['gas station']=R(12,10,26,44,'#ef5b3f',4)+R(17,15,16,12,'#bfe9ff',2)+TX(25,43,'GAS',9,'#fff')+R(8,52,34,7,'#546e7a',2)+L("M38 24H46V40")+P("M43 40H49L48 48H44Z",D);
I.supermarket=shop('#ffe0b2','#ef5350','#fff',L("M26 7H28L30 14H37L38 9H29")+Ci(31,17,1.2,D)+Ci(36,17,1.2,D));

I.mall=R(6,22,52,32,'#ffb74d')+R(4,14,56,10,'#ef5b3f',2)+TX(32,22,'MALL',8,'#fff')+[12,27,42].map(x=>R(x,30,10,10,'#bfe9ff',2)).join("")+R(25,42,14,12,'#fff4d6',2);
I.library=classic('#cfe3ff','#5c6bc0',R(26,16,6,8,'#42a5f5')+R(32,16,6,8,'#ef5350'));
I.university=classic('#e1c9ff','#7e57c2',P("M25 19L32 14L39 19L32 24Z",D)+L("M28 21V24"));
I.museum=P("M5 22L32 8L59 22Z",'#f0c987')+[0,1,2,3].map(i=>R(11+i*13.5,23,7,25,'#fff4d6',1)).join("")+R(5,48,54,8,'#e0b36a',2);
I.church=R(14,30,36,24,'#f5e6c8')+P("M10 31L32 19L54 31Z",'#c0663b')+R(27,8,10,12,'#f5e6c8')+P("M26 9L32 1L38 9Z",'#c0663b')+P("M27 54V45Q27 38 32 38Q37 38 37 45V54Z",'#8d5a3b')+Ci(32,26,0.1,D);
I.cathedral=R(22,26,20,28,'#e8c99a')+R(8,18,14,36,'#d9b27c')+R(42,18,14,36,'#d9b27c')+P("M7 19L15 4L23 19Z",'#b0643c')+P("M41 19L49 4L57 19Z",'#b0643c')+Ci(32,34,5,'#bfe9ff')+P("M28 54V46Q28 42 32 42Q36 42 36 46V54Z",'#8d5a3b');
I.theater=classic('#ffcdd2','#c62828',Ci(27,20,4,'#ffd34d')+Ci(37,20,4,'#ff8fb1'));
I['movie theater']=shop('#d1c4e9','#e53935','#fff',P("M29 7L37 12L29 17Z",'#e53935'));
I.hotel=tall('#ffe0b2','#fb8c00',TX(32,21,'HOTEL',7));

I['fast food stand']=P("M6 26Q32 -4 58 26Z",'#ef5b3f')+P("M22 18L32 26L42 18Q32 10 22 18Z",'#fff')+L("M32 26V32")+R(10,32,44,16,'#ffd34d',3)+R(15,36,14,8,'#fff4d6',2)+Ci(20,52,5,'#90a4ae')+Ci(44,52,5,'#90a4ae');
I.park=R(14,34,6,20,'#8d5a3b')+Ci(17,26,13,'#4caf50')+R(41,32,6,22,'#8d5a3b')+Ci(44,22,14,'#66bb6a')+L("M4 56H60");
I.square=L("M32 30Q22 16 14 32","#4f9be8")+L("M32 30Q42 16 50 32","#4f9be8")+R(28,28,8,18,'#b3e5fc',2)+P("M8 44H56L50 56H14Z",'#90caf9')+L("M10 44Q32 36 54 44");
// temperature
const th=(f,lv,x='')=>R(26,6,12,40,'#fff',6)+R(29.5,44-lv,5,lv+2,f)+Ci(32,50,9,f)+x;
I.warm=th('#ff9800',20,Ci(51,14,6,'#ffd54f'));
I.hot=th('#e53935',32,L("M47 10Q52 18 47 26Q42 34 47 42","#ef5b3f")+L("M55 14Q59 20 55 28","#ef5b3f"));
I.cold=th('#42a5f5',10,flake(50,18,7));
I.cool=th('#81d4fa',16,P("M44 28Q46 12 58 14Q58 28 44 28Z",'#66bb6a'));
I.high=th('#e53935',32,L("M50 30V10M44 16L50 10L56 16"));
I.low=th('#42a5f5',8,L("M50 10V30M44 24L50 30L56 24"));
I.freezing=th('#1e88e5',6,flake(50,14,6)+flake(52,30,4));
// weather
I.sunny=sun(32,32,13);
I.rainy=cl('#b0bec5','translate(4,-6)')+drop(22,44)+drop(33,48)+drop(44,44);
I.cloudy=cl('#dfe7ee','translate(12,-8)')+cl('#ffffff','translate(0,2)');
I.windy=L("M8 24H38Q50 24 50 16Q50 10 43 10")+L("M8 34H46Q58 34 58 42Q58 50 49 50")+L("M8 44H28")+P("M50 28Q58 22 60 28Q54 34 50 28Z",'#66bb6a');
I.stormy=cl('#78909c','translate(4,-8)')+P("M35 32L24 48H32L28 60L43 41H35L39 32Z",'#ffd54f');
I.snowy=cl('#e3f2fd','translate(4,-8)')+flake(22,48)+flake(34,54)+flake(46,48);
I.foggy=cl('#cfd8dc','translate(4,-10)')+L("M8 42H56","#78909c")+L("M14 50H50","#78909c")+L("M20 58H44","#78909c");
// seasons
const petals=[...Array(5)].map((_,i)=>{const a=i*2*Math.PI/5;return Ci(32+Math.sin(a)*10,22-Math.cos(a)*10,7,'#ff8fb1')}).join("");
I.spring=L("M32 30V58")+P("M32 50Q44 42 48 50Q40 58 32 50Z",'#66bb6a')+petals+Ci(32,22,6,'#ffd54f');
I.summer=sun(32,26,12,1)+L("M4 56Q12 48 20 56T36 56T52 56T64 56","#42a5f5");
I.fall=P("M32 5Q51 14 51 34Q51 50 32 56Q13 50 13 34Q13 14 32 5Z",'#f57c00')+L("M32 12V62M32 32L42 24M32 42L22 34M32 24L24 18");
I.winter=Ci(32,47,13,'#fff')+Ci(32,27,10,'#fff')+R(24,8,16,10,'#455a64',2)+R(21,16,22,4,'#455a64',2)+Ci(28,26,1.2,D)+Ci(36,26,1.2,D)+P("M32 28L41 31L32 33Z",'#ff7043')+R(23,35,18,5,'#ef5350',2)+Ci(32,48,1.4,D)+Ci(32,54,1.4,D);
I['dry season']=R(26,14,12,42,'#43a047',6)+R(10,24,9,18,'#43a047',4)+R(14,36,14,7,'#43a047',3)+R(45,18,9,16,'#43a047',4)+R(36,28,14,7,'#43a047',3)+P("M2 56Q32 48 62 56V62H2Z",'#f0c987')+Ci(54,8,0.1,D);
const umb=f=>P("M6 32Q10 8 32 8Q54 8 58 32Q50 26 45 32Q38 26 32 32Q26 26 19 32Q14 26 6 32Z",f)+L("M32 32V50Q32 56 38 56Q42 56 42 52");

// clothes
const tee=f=>P("M21 10L7 20L13 30L19 26V54H45V26L51 30L57 20L43 10Q32 18 21 10Z",f);
I['T-shirt']=tee('#ffffff');
I.sweater=P("M21 10L4 32L12 38L19 30V54H45V30L52 38L60 32L43 10Q32 18 21 10Z",'#43a047')+L("M19 48H45M19 52H45");
I.top=P("M22 8H27L30 20H34L37 8H42L46 26L44 54H20L18 26Z",'#ff8fb1')+L("M20 46Q32 50 44 46");
I.blouse=tee('#90caf9')+L("M26 10L32 20L38 10")+P("M32 22L23 18V28Z",'#1e88e5')+P("M32 22L41 18V28Z",'#1e88e5')+Ci(32,22,3,'#1e88e5');
I.shirt=tee('#64b5f6')+P("M26 10L32 20L38 10L32 13Z",'#fff')+L("M32 20V54")+Ci(32,30,1.2,D)+Ci(32,38,1.2,D)+Ci(32,46,1.2,D);
I.shorts=P("M14 12H50L54 46H36L32 28L28 46H10Z",'#d9b26f')+L("M14 20H50");
I.pants=P("M18 6H46L50 58H35L32 24L29 58H14Z",'#3f7fd6')+L("M18 14H46");
I.skirt=P("M22 10H42L56 54H8Z",'#ff80ab')+R(21,8,22,6,'#f06292',2)+L("M26 14L18 54M38 14L46 54");
I.dress=P("M22 6H27L29 18H35L37 6H42L45 20L56 56H8L19 20Z",'#e53935')+R(19,26,26,5,'#b71c1c',1);

I['bathing suit']=P("M22 6H27L29 18Q32 22 35 18L37 6H42L43 30L47 54H17L21 30Z",'#29b6f6')+Ci(28,34,2,'#fff')+Ci(36,40,2,'#fff')+Ci(30,47,2,'#fff');
I.uniform=P("M20 8L6 24L12 32L19 28V56H45V28L52 32L58 24L44 8L32 22Z",'#283593')+P("M26 8L32 22L38 8Z",'#fff')+P("M30 16H34L35 34L32 38L29 34Z",'#e53935');
I.sneakers=P("M6 42Q6 28 16 28L24 30L32 37L50 38Q60 40 58 48H8Q6 46 6 42Z",'#1e88e5')+R(6,46,52,8,'#fff',3)+L("M24 30L28 36M30 33L34 38");
const sole=`<path d="M20 8Q30 8 30 22Q30 46 22 56Q12 58 12 40Q12 18 20 8Z" fill="#ff8fb1"/><path d="M14 24L21 36L28 24" fill="none"/>`;
I['flip-flops']=`<g transform="translate(-6,0)">${sole}</g><g transform="translate(26,0)">${sole}</g>`;
I.boots=P("M20 6H38V34L52 40Q56 44 56 52H18Z",'#8d5a3b')+R(16,52,42,6,'#5d4037',2)+L("M20 14H38M20 22H38");
I.heels=P("M10 10H24V32L52 42Q58 48 52 52H32Q24 50 22 42L18 56H10Z",'#e53935');
I.shoes=P("M6 40Q6 30 16 30L26 32L34 38L52 38Q60 40 58 48H8Q6 46 6 40Z",'#8d5a3b')+R(6,46,52,6,'#4e342e',3)+L("M26 32L30 38");
